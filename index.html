<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fischquiz</title>
  <meta name="description" content="Fische bestimmen lernen für die Fischerprüfung Niedersachsen">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fischquiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#cfe6ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06141c">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
  <!-- Der See hinter dem Glas -->
  <div class="see" aria-hidden="true">
    <i class="tiefe"></i><i class="b1"></i><i class="b2"></i><i class="b3"></i>
    <i class="strahl s1"></i><i class="strahl s2"></i><i class="strahl s3"></i>
    <i class="korn"></i>
  </div>

  <div class="app">
    <nav class="leiste" aria-label="Hauptnavigation">
      <div class="marke"><span class="marke-icon"></span><span>Fischquiz</span></div>
      <button class="tab" data-ziel="start"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span>Start</span></button>
      <button class="tab" data-ziel="lernen"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="13" height="14" rx="2.5"/><path d="M7.5 3.5h10a3 3 0 0 1 3 3V17"/></svg><span>Lernen</span></button>
      <button class="tab" data-ziel="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.6" r=".4"/></svg><span>Quiz</span></button>
      <button class="tab" data-ziel="pruefung"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M8.5 12.5l2.4 2.4 4.6-4.8"/></svg><span>Prüfung</span></button>
      <button class="tab" data-ziel="fortschritt"><svg viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20v-5M20 20V5"/></svg><span>Fortschritt</span></button>
    </nav>

    <main class="buehne" id="buehne" tabindex="-1"></main>
  </div>

  <!-- Bestätigungsdialog (eigener, kein confirm()) -->
  <div class="dialog-hg" id="dialog" hidden>
    <div class="dialog glas" role="alertdialog" aria-modal="true" aria-labelledby="dialog-titel">
      <h2 id="dialog-titel"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-knoepfe">
        <button class="knopf leise" id="dialog-nein">Abbrechen</button>
        <button class="knopf gefahr" id="dialog-ja">Löschen</button>
      </div>
    </div>
  </div>

  <script src="species.js?v=2"></script>
  <script src="data/credits.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
